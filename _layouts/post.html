<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{{ page.title }} - blog.theluqmn.com</title>

        <!--open graph-->
        <meta property="og:title" content="{{ page.title }} - blog.theluqmn.com" />
        <meta property="og:description" content= "{{ post.excerpt }}"/>

        <!--tailwind css-->
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {}
                }
            }
        </script>
    </head>

    <body class="bg-[rgb(5,5,5)]">
        <main class="p-4 md:p-8 w-full h-full flex flex-col gap-16 md:w-7/12 mx-auto">
            <!--navbar-->
            <div class="p-4 w-full flex gap-12 bg-[rgb(255,255,255)]">
                <p class="text-[rgb(0,0,0)] text-bold">blog.theluqmn.com</h1>
                <a class="text-[rgb(0,157,255)]" href="https://blog.theluqmn.com/">home</a>
                <a class="text-[rgb(0,157,255)]" href="https://theluqmn.com">portfolio</a>
            </div>

            <!--header-->
            <div class="flex flex-col gap-4 items-start">
                <h1 class="text-3xl text-[rgb(0,157,255)] font-bold">
                    {{ page.title }}
                </h1>

                <p class="text-sm text-[rgb(220,220,220)] font-bold">
                    {{ page.date | date: "%d %B %Y" }}
                </p>
            </div>

            <!--content-->
            <div class="
            space-y-3
            text-sm text-[rgb(220,220,220)]
            [&_h1]:text-3xl [&_h1]:pt-12 [&_h1]:font_bold [&_h1]:text-[rgb(0,157,255)]
            [&_h2]:text-xl [&_h2]:pt-8 [&_h2]:font-semibold [&_h2]:text-[rgb(255,255,255)]
            [&_h3]:text-lg [&_h3]:pt-4 [&_h3]:font-semibold [&_h3]:text-[rgb(255,255,255)]
            [&_a]:font-semibold [&_a]:underline
            [&_img]:w-full [&_img]:rounded-md
            ">
                {{ content }}
            </div>
        </main>
    </body>
</html>
